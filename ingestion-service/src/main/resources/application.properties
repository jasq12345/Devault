spring.application.name=ingestion

server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_AUTH:ingestion_db}
spring.datasource.username=${DB_USER_AUTH:auth_user}
spring.datasource.password=${DB_PASSWORD_AUTH}

spring.jpa.hibernate.ddl-auto=update

authlib.jwt.issuer=${JWT_ISSUER:devault-auth}

authlib.jwks.uri=http://${JWKS_HOST:localhost}:8081/.well-known/jwks.json
