services:
  workspace-service:
    container_name: ${PROJECT_NAME}-workspace
    build:
      context: .
      dockerfile: ./workspace-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER_WORKSPACE: ${DB_USER_WORKSPACE}
      DB_PASSWORD_WORKSPACE: ${DB_PASSWORD_WORKSPACE}
      DB_NAME_WORKSPACE: ${DB_NAME_WORKSPACE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER}
      JWKS_HOST: ${JWKS_HOST}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - prod

  auth-service:
    container_name: ${PROJECT_NAME}-auth
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER_AUTH: ${DB_USER_AUTH}
      DB_PASSWORD_AUTH: ${DB_PASSWORD_AUTH}
      DB_NAME_AUTH: ${DB_NAME_AUTH}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_ISSUER: ${JWT_ISSUER}
      JWKS_HOST: ${JWKS_HOST}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - prod

  ingestion-service:
    container_name: ${PROJECT_NAME}-ingestion
    build:
      context: .
      dockerfile: ./ingestion-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER_INGESTION: ${DB_USER_INGESTION}
      DB_PASSWORD_INGESTION: ${DB_PASSWORD_INGESTION}
      DB_NAME_INGESTION: ${DB_NAME_INGESTION}
      INGESTION_TOKEN_ENCRYPTION_KEY: ${INGESTION_TOKEN_ENCRYPTION_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWKS_HOST: ${JWKS_HOST}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - prod

  postgres:
    container_name: ${PROJECT_NAME}-postgres
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres  # domyślna, nie używana
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

#  nginx:
#    container_name: ${PROJECT_NAME}-nginx
#    image: nginx:1.27
#    environment:
#      NGINX_HOST: ${NGINX_HOST}
#      NGINX_PORT: ${NGINX_PORT}
#    volumes:
#      - ./nginx.conf:/etc/nginx/nginx.conf:ro
#    ports:
#      - "80:80"

  redis:
    container_name: ${PROJECT_NAME}-redis
    image: redis:8.6.3
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    container_name: ${PROJECT_NAME}-kafka
    image: apache/kafka:4.2.0
    expose:
      - "${KAFKA_HOST_PORT}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${PROJECT_NAME}-kafka:${KAFKA_CONTROLLER_PORT}

      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT},
        HOST://0.0.0.0:${KAFKA_HOST_PORT},
        CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://${PROJECT_NAME}-kafka:${KAFKA_INTERNAL_PORT},
        HOST://localhost:${KAFKA_HOST_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${KAFKA_INTERNAL_PORT} || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  kafka_data:


