spring.application.name=workspace

server.port=8080

server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_WORKSPACE:workspace_db}
spring.datasource.username=${DB_USER_WORKSPACE:workspace_user}
spring.datasource.password=${DB_PASSWORD_WORKSPACE}

spring.jpa.hibernate.ddl-auto=create

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

authlib.jwks.uri=http://${JWKS_HOST:localhost}:8081/.well-known/jwks.json

authlib.jwt.issuer=${JWT_ISSUER:devault-auth}

# OpenAPI docs (springdoc): reachable without JWT so Insomnia / Swagger UI can fetch the spec
authlib.security.public-paths=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
